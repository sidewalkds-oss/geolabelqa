[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geolabelqa"
version = "0.1.0"
description = "Spatially aware quality assurance for geospatial machine-learning training labels"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kaisi Omar" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]
keywords = ["geospatial", "remote sensing", "label noise", "data quality", "machine learning", "GIS"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
geolabelqa = "geolabelqa.cli:main"

[project.urls]
Repository = "https://github.com/sidewalkds-oss/geolabelqa"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:.*sklearn.utils.parallel.delayed.*:UserWarning"]
